<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Data Wizard</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjggOCA0OCA0OCI+CiAgPHJlY3QgeD0iOCIgeT0iOCIgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQ4IiByeD0iMTMiIGZpbGw9IiNCNDhBRTgiLz4KICA8ZyB0cmFuc2Zvcm09InRyYW5zbGF0ZSgxMyAxMykgc2NhbGUoMS42KSIgZmlsbD0iIzJCMkIyQiI+CiAgICA8cGF0aCBkPSJNNS41IDE4LjUgMTQgMTAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzJCMkIyQiIgc3Ryb2tlLXdpZHRoPSIyLjciIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPgogICAgPHBhdGggZD0iTTE3LjUgMi42IDE4LjcgNS4zIDIxLjQgNi41IDE4LjcgNy43IDE3LjUgMTAuNCAxNi4zIDcuNyAxMy42IDYuNSAxNi4zIDUuM1oiLz4KICAgIDxjaXJjbGUgY3g9IjExIiBjeT0iNC42IiByPSIxLjIiLz4KICAgIDxjaXJjbGUgY3g9IjIwLjQiIGN5PSIxMyIgcj0iMS4yIi8+CiAgPC9nPgo8L3N2Zz4K">
  <style>
/* Data Wizard: Performance Suite "JMeter Darcula" theme */

:root {
  /* Suite neutrals (identical across tools) */
  --bg: #2B2B2B;
  --topbar: #333536;
  --surface: #3C3F41;
  --well: #212223;
  --ink: #D6D6D6;
  --muted: #9AA0A0;
  --dim: #8A9090;
  --line: #4F5355;
  --line-soft: #34383A;
  --ok: #6EBF6E;
  --danger: #FF6E67;

  /* Tool accent: Data Wizard lavender */
  --accent: #B48AE8;
  --accent-hover: #C3A0EE;
  --accent-press: #9F72DB;
  --accent-tint: rgba(180, 138, 232, 0.14);

  /* Output syntax */
  --syn-num: #E0B060;
  --syn-str: #8FB573;

  /* Shape and type */
  --r-s: 4px;
  --r-m: 6px;
  --r-l: 10px;
  --t-xs: 11px;
  --t-s: 12px;
  --t-m: 13px;
  --t-l: 15px;
  --t-xl: 19px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Cascadia Mono", Menlo, "SF Mono", ui-monospace, monospace;

  --topbar-h: 52px;
  --fast: 120ms;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
}

body {
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--t-m);
  line-height: 1.5;
  overflow: hidden;
}

button, input { font: inherit; color: inherit; }

[hidden] { display: none !important; }

.icon {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

/* ---------- App shell ---------- */

.app {
  height: 100vh;
  height: 100dvh;
  max-width: 2000px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}

.topbar {
  flex: 0 0 auto;
  min-height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 16px;
  background: var(--topbar);
  border-bottom: 1px solid var(--line-soft);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1 1 auto;
}

/* Chip geometry matches Commandeer: 48x48 rect, rx 13, in a 64 viewBox */
.chip { width: 36px; height: 36px; margin: -4px; flex-shrink: 0; display: block; }
.chip-bg { fill: var(--accent); }
.chip-glyph { fill: var(--bg); stroke: var(--bg); stroke-width: 0; }
.chip-glyph path[fill="none"] { stroke-width: 2.6; }

.tool-name {
  font-size: var(--t-l);
  font-weight: 600;
  white-space: nowrap;
}

.tool-ver {
  font-family: var(--mono);
  font-size: var(--t-xs);
  color: var(--dim);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 32px;
  padding: 0 12px;
  border-radius: var(--r-s);
  border: 1px solid transparent;
  font-size: var(--t-m);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color var(--fast), border-color var(--fast), color var(--fast);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { cursor: not-allowed; }

.btn.primary {
  background: var(--accent);
  color: var(--bg);
  font-weight: 600;
}
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn.primary:active:not(:disabled) { background: var(--accent-press); }
.btn.primary:disabled { background: var(--surface); color: var(--dim); }
.btn.primary.working { background: var(--surface); color: var(--ink); cursor: wait; }

.btn.ghost {
  background: transparent;
  border-color: var(--line);
  color: var(--ink);
}
.btn.ghost:hover:not(:disabled) { background: var(--surface); }
.btn.ghost:active:not(:disabled) { background: var(--line-soft); }
.btn.ghost:disabled { color: var(--dim); border-color: var(--line-soft); }

/* ---------- Workspace ---------- */

.workspace {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(340px, 400px) 1fr;
}

.form-pane {
  min-height: 0;
  overflow-y: auto;
  padding: 16px 24px 32px 16px;
  border-right: 1px solid var(--line-soft);
}

.section + .section { margin-top: 24px; }

.section-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 16px;
  font-family: var(--mono);
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.section-head::before {
  content: "";
  width: 7px;
  height: 7px;
  background: var(--accent);
  flex-shrink: 0;
}
.section-head::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}

/* ---------- File types matrix ---------- */

.type-grid {
  display: grid;
  grid-template-columns: 56px 1fr 1fr;
  align-items: center;
  row-gap: 4px;
}

.col-head {
  font-size: var(--t-s);
  color: var(--muted);
  text-align: center;
  padding-bottom: 4px;
}

.row-head {
  font-family: var(--mono);
  font-size: var(--t-m);
  font-weight: 600;
  color: var(--ink);
}

.cell {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 32px;
  border-radius: var(--r-s);
  cursor: pointer;
  transition: background-color var(--fast);
}
.cell:hover { background: var(--line-soft); }

.cell input {
  position: absolute;
  inset: 0;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.box {
  width: 16px;
  height: 16px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface);
  display: grid;
  place-items: center;
  transition: background-color var(--fast), border-color var(--fast);
}
.cell:hover .box { border-color: var(--muted); }
.cell input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
.cell input:checked + .box { background: var(--accent); border-color: var(--accent); }
.cell input:checked + .box::after {
  content: "";
  width: 8px;
  height: 4px;
  border-left: 2px solid var(--bg);
  border-bottom: 2px solid var(--bg);
  transform: translateY(-1px) rotate(-45deg);
}

/* ---------- Segmented control ---------- */

.seg-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 16px;
}

.seg {
  display: inline-flex;
  padding: 2px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
}
.seg label { position: relative; display: block; }
.seg input {
  position: absolute;
  inset: 0;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
.seg span {
  display: grid;
  place-items: center;
  height: 26px;
  min-width: 52px;
  padding: 0 12px;
  border-radius: var(--r-s);
  font-size: var(--t-s);
  color: var(--muted);
  transition: background-color var(--fast), color var(--fast);
  pointer-events: none;
}
.seg label:hover span { color: var(--ink); }
.seg input:checked + span { background: var(--accent); color: var(--bg); font-weight: 600; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Text input ---------- */

.text-input {
  width: 100%;
  height: 32px;
  padding: 0 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  font-size: var(--t-m);
  outline: none;
  transition: border-color var(--fast), box-shadow var(--fast);
}
.mono-input { font-family: var(--mono); }
.text-input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.text-input[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }

.caption {
  margin: 4px 0 0;
  font-size: var(--t-s);
  color: var(--muted);
}

/* ---------- Size range ---------- */

.size-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.field { min-width: 0; }

.boundary-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 128px;
  gap: 12px;
}

.field-label {
  display: block;
  margin-bottom: 4px;
  font-size: var(--t-s);
  color: var(--muted);
}

.stepper {
  display: flex;
  height: 32px;
}

.step-btn {
  flex: 0 0 28px;
  display: grid;
  place-items: center;
  padding: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--muted);
  cursor: pointer;
  transition: background-color var(--fast), color var(--fast);
}
.step-btn:first-child { border-radius: var(--r-s) 0 0 var(--r-s); border-right: 0; }
.step-btn:last-child { border-radius: 0 var(--r-s) var(--r-s) 0; border-left: 0; }
.step-btn:hover { background: var(--line); color: var(--ink); }
.step-btn:active { background: var(--line-soft); }
.step-btn .icon { width: 14px; height: 14px; }

.step-field {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
}
.step-field input {
  width: 100%;
  height: 100%;
  padding: 0 28px 0 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 0;
  font-family: var(--mono);
  font-size: var(--t-m);
  text-align: right;
  outline: none;
  transition: border-color var(--fast), box-shadow var(--fast);
}
.step-field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
  position: relative;
  z-index: 1;
}
.step-field input[aria-invalid="true"] {
  border-color: var(--danger);
  box-shadow: 0 0 0 1px var(--danger);
  position: relative;
  z-index: 1;
}
.unit {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--mono);
  font-size: var(--t-xs);
  color: var(--muted);
  pointer-events: none;
  z-index: 2;
}

.field-error {
  margin: 4px 0 0;
  min-height: 0;
  font-size: var(--t-s);
  color: var(--danger);
}
.field-error:empty { display: none; }
#err-sizes { margin-top: 12px; }

.size-preview {
  margin: 12px 0 0;
  font-family: var(--mono);
  font-size: var(--t-s);
  color: var(--muted);
  word-break: break-word;
}
.size-preview:empty { display: none; }

/* ---------- Output pane ---------- */

.output-pane {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--well);
}

.out-head {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 16px;
  min-height: 40px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--line-soft);
  font-family: var(--mono);
  font-size: var(--t-s);
}

.out-file { color: var(--ink); font-weight: 600; }

.out-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  color: var(--muted);
}
.out-meta .flag { color: var(--danger); }
.out-meta b { color: var(--syn-num); font-weight: 500; }

.out-status {
  margin-left: auto;
  color: var(--muted);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.out-status.ok { color: var(--ok); }
.out-status.err { color: var(--danger); }
.out-status.busy { color: var(--accent); }

.out-warning {
  flex: 0 0 auto;
  margin: 0;
  padding: 8px 16px;
  border-bottom: 1px solid var(--line-soft);
  font-size: var(--t-s);
  color: var(--danger);
}

.out-body {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  overflow: auto;
}

.tree {
  margin: 0;
  padding: 12px 16px 24px;
  font-family: var(--mono);
  font-size: var(--t-m);
  line-height: 1.6;
  color: var(--ink);
  width: max-content;
  min-width: 100%;
  column-gap: 32px;
  column-rule: 1px solid var(--line-soft);
}
/* Several columns: fill the pane width; each set stays in one column when it fits */
.tree.multi { width: auto; }
.tree .grp { break-inside: avoid; }
.tree .grp + .grp { margin-top: 1.6em; } /* one blank line; dropped at the top of a column */
.tree .ln { display: block; white-space: pre; border-radius: 4px; transition: background-color var(--fast); }
.tree .ln.dir { break-after: avoid; }
.tree .t-dir { color: var(--accent); }
.tree .t-cmt { color: var(--muted); }
.tree .t-num { color: var(--syn-num); }
.tree .t-file { color: var(--ink); }
.tree .ln.cur { background: var(--accent-tint); }
.tree .ln.done .t-num { color: var(--ok); }

.out-empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 24px;
  color: var(--muted);
  text-align: center;
}
.out-empty .icon { width: 32px; height: 32px; stroke-width: 1.5; }
.out-empty p { margin: 0; font-size: var(--t-m); }

/* ---------- Responsive ---------- */

@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100vh; }
  .workspace { display: block; }
  .form-pane {
    overflow: visible;
    border-right: 0;
    border-bottom: 1px solid var(--line-soft);
    padding: 16px;
  }
  .output-pane { min-height: 360px; }
  .out-body { max-height: 70vh; }
}

@media (max-width: 720px) {
  .topbar { flex-wrap: wrap; padding: 8px 16px; row-gap: 8px; }
  .btn { padding: 0; width: 32px; }
  .btn-label { display: none; }
}

@media (max-width: 560px) {
  .size-grid, .boundary-grid { grid-template-columns: 1fr; }
  .out-status { margin-left: 0; flex-basis: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="chip" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect x="8" y="8" width="48" height="48" rx="13" class="chip-bg"/>
          <g class="chip-glyph" transform="translate(14 14) scale(1.5)">
            <path d="M5.5 18.5 14 10" fill="none" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M17.5 2.6 18.7 5.3 21.4 6.5 18.7 7.7 17.5 10.4 16.3 7.7 13.6 6.5 16.3 5.3Z"/>
            <circle cx="11" cy="4.6" r="1.1"/>
            <circle cx="20.4" cy="13" r="1.1"/>
          </g>
        </svg>
        <span class="tool-name">Data Wizard</span>
        <span class="tool-ver">v0.1</span>
      </div>
      <div class="top-actions">
        <button type="button" id="copy" class="btn ghost" aria-label="Copy manifest" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span class="btn-label" id="copy-label">Copy</span>
        </button>
        <button type="submit" id="generate" class="btn primary" form="config" aria-label="Generate and download zip" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
          <span class="btn-label" id="generate-label">Generate</span>
        </button>
      </div>
    </header>

    <div class="workspace">
      <form id="config" class="form-pane" novalidate>
        <section class="section" aria-labelledby="h-types">
          <h2 class="section-head" id="h-types">File types</h2>
          <div class="type-grid" role="group" aria-labelledby="h-types">
            <span></span>
            <span class="col-head">Compressible</span>
            <span class="col-head">Uncompressible</span>

            <span class="row-head">PDF</span>
            <label class="cell"><input type="checkbox" name="type" value="pdf-comp" aria-label="PDF compressible" checked><span class="box" aria-hidden="true"></span></label>
            <label class="cell"><input type="checkbox" name="type" value="pdf-unc" aria-label="PDF uncompressible"><span class="box" aria-hidden="true"></span></label>

            <span class="row-head">PNG</span>
            <label class="cell"><input type="checkbox" name="type" value="png-comp" aria-label="PNG compressible"><span class="box" aria-hidden="true"></span></label>
            <label class="cell"><input type="checkbox" name="type" value="png-unc" aria-label="PNG uncompressible"><span class="box" aria-hidden="true"></span></label>

            <span class="row-head">JPEG</span>
            <label class="cell"><input type="checkbox" name="type" value="jpeg-comp" aria-label="JPEG compressible"><span class="box" aria-hidden="true"></span></label>
            <label class="cell"><input type="checkbox" name="type" value="jpeg-unc" aria-label="JPEG uncompressible"><span class="box" aria-hidden="true"></span></label>

            <span class="row-head">DOCX</span>
            <label class="cell"><input type="checkbox" name="type" value="docx-comp" aria-label="DOCX compressible"><span class="box" aria-hidden="true"></span></label>
            <label class="cell"><input type="checkbox" name="type" value="docx-unc" aria-label="DOCX uncompressible"><span class="box" aria-hidden="true"></span></label>

            <span class="row-head">XLSX</span>
            <label class="cell"><input type="checkbox" name="type" value="xlsx-comp" aria-label="XLSX compressible"><span class="box" aria-hidden="true"></span></label>
            <label class="cell"><input type="checkbox" name="type" value="xlsx-unc" aria-label="XLSX uncompressible"><span class="box" aria-hidden="true"></span></label>
          </div>
        </section>

        <section class="section" aria-labelledby="h-sizes">
          <h2 class="section-head" id="h-sizes">Sizes</h2>
          <div class="seg-row">
            <div class="seg" role="radiogroup" aria-label="Size mode">
              <label><input type="radio" name="size-mode" value="range" checked><span>Range</span></label>
              <label><input type="radio" name="size-mode" value="list"><span>List</span></label>
              <label><input type="radio" name="size-mode" value="boundary"><span>Boundary</span></label>
            </div>
            <div class="seg" role="radiogroup" aria-label="Unit" id="unit-seg">
              <label><input type="radio" name="size-unit" value="KB"><span>KB</span></label>
              <label><input type="radio" name="size-unit" value="MB" checked><span>MB</span></label>
            </div>
          </div>

          <div class="field" id="list-fields" hidden>
            <label class="field-label" for="size-list">Size list</label>
            <input type="text" class="text-input mono-input" id="size-list" autocomplete="off" spellcheck="false" value="1MB, 5MB, 10MB" aria-describedby="list-caption err-list">
            <p class="caption" id="list-caption">Comma-separated. Units: B, KB, MB.</p>
            <p class="field-error" id="err-list"></p>
          </div>

          <div class="boundary-grid" id="boundary-fields" hidden>
            <div class="field">
              <label class="field-label" for="size-limits">Limits</label>
              <input type="text" class="text-input mono-input" id="size-limits" autocomplete="off" spellcheck="false" value="5MB" aria-describedby="limits-caption err-limits">
              <p class="caption" id="limits-caption">Comma-separated. Units: B, KB, MB.</p>
              <p class="field-error" id="err-limits"></p>
            </div>
            <div class="field">

    else if (parsed.items.length > MAX_SIZES) errs.list = `${fmtNum(parsed.items.length)} sizes; limit is ${MAX_SIZES}`;
    else sizes = parsed.items.map(plainSize).sort((a, b) => a.bytes - b.bytes);
  }

  if (Object.values(errs).some(Boolean)) return { sizes: [], errs };

  // Format minimums (only for the formats actually selected)
  if (sizes.length && state.types.length) {
    const smallest = sizes[0].bytes;
    const kinds = [...new Set(state.types.map((k) => TYPES[k].kind))];
    const under = kinds.filter((k) => smallest < MIN_BYTES[k]);
    if (under.length) {
      errs.sizes = "Smallest size is below the minimum for " +
        under.map((k) => `${k.toUpperCase()} (${fmtNum(MIN_BYTES[k])} B)`).join(", ");
      return { sizes: [], errs };
    }
  }
  return { sizes, errs };
}

function fmtBytes(n) {
  if (n < 1024) return `${n} B`;
  if (n < MB) return `${(n / 1024).toFixed(1)} KB`;
  if (n < 1024 * MB) return `${(n / MB).toFixed(1)} MB`;
  return `${(n / (1024 * MB)).toFixed(2)} GB`;
}

function fmtExact(n) {
  return `${fmtNum(n)} B`;
}

function todayISO() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}

function buildFileSpecs(state, sizes) {
  const specs = [];
  for (const key of state.types) {
    const t = TYPES[key];
    for (const s of sizes) {
      specs.push({
        typeKey: key,
        dir: t.dir,
        name: `DW_${t.prefix}_${t.v}_${s.label}.${t.ext}`,
        mime: MIME[t.ext],
        sizeBytes: s.bytes,
      });
    }
  }
  return specs;
}

// Packaging adapts to the batch:
//   1 file          -> the file itself, no zip
//   1 set           -> DW_<date>.zip with the files at its root
//   several sets    -> DW_<date>.zip with one folder per set
function planOutput(specs) {
  const sets = new Set(specs.map((s) => s.typeKey)).size;
  if (specs.length === 1) {
    return { kind: "single", outName: specs[0].name, path: (s) => s.name };
  }
  const outName = `DW_${todayISO()}.zip`;
  if (sets === 1) return { kind: "flat", outName, path: (s) => s.name };
  return { kind: "folders", outName, path: (s) => `${s.dir}/${s.name}` };
}

function showFieldErrors(errs) {
  for (const key of Object.keys(errEls)) {
    errEls[key].textContent = errs[key];
    const input = inputFor[key];
    if (!input) continue;
    if (errs[key]) input.setAttribute("aria-invalid", "true");
    else input.removeAttribute("aria-invalid");
  }
}

// ---------- Rendering ----------

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Builds the zip tree. Each line is a list of [class, text] tokens, so the
// coloured view and the copied plain text come from the same source.
function buildTree(specs, types, layout) {
  const groups = [];
  for (const key of types) {
    const files = specs.filter((s) => s.typeKey === key);
    if (files.length) groups.push({ key, files });
  }

  // Folder lines only when the zip actually has folders (several sets)
  const nested = layout.kind === "folders";
  const fileIndent = nested ? "  " : "";
  const nameCol =
    Math.max(
      ...(nested ? groups.map((g) => g.files[0].dir.length + 1) : []),
      ...specs.map((s) => fileIndent.length + s.name.length),
    ) + 4;
  const groupBytes = (g) => g.files.reduce((a, s) => a + s.sizeBytes, 0);
  const numW = Math.max(
    ...specs.map((s) => fmtExact(s.sizeBytes).length),
    ...(nested ? groups.map((g) => fmtBytes(groupBytes(g)).length) : []),
  );
  const countW = nested ? Math.max(...groups.map((g) => `${g.files.length} files`.length)) : 0;
  const numGap = nested ? countW + 2 : 0;

  const lines = [];
  for (const g of groups) {
    if (nested) {
      const dirText = `${g.files[0].dir}/`;
      const count = `${g.files.length} file${g.files.length === 1 ? "" : "s"}`;
      lines.push({
        group: g.key,
        dir: true,
        tokens: [
          ["t-dir", dirText],
          ["", " ".repeat(nameCol - dirText.length)],
          ["t-cmt", count.padEnd(countW)],
          ["", "  "],
          ["t-num", fmtBytes(groupBytes(g)).padStart(numW)],
        ],
      });
    }
    for (const f of g.files) {
      const nameText = `${fileIndent}${f.name}`;
      lines.push({
        group: g.key,
        spec: f,
        tokens: [
          ["t-file", nameText],
          ["", " ".repeat(nameCol - nameText.length + numGap)],
          ["t-num", fmtExact(f.sizeBytes).padStart(numW)],
        ],
      });
    }
  }
  return lines;
}

// Each set renders as its own block so the column layout can keep a folder
// header with its files. The copied text is always the single-column list.
function renderTree(lines) {
  const frag = document.createDocumentFragment();
  const plain = [];
  let fileIdx = 0;
  let block = null;
  let blockKey = null;
  for (const line of lines) {
    if (line.group !== blockKey) {
      if (block) plain.push(""); // blank line between sets, as on screen
      block = el("div", "grp");
      frag.appendChild(block);
      blockKey = line.group;
    }
    const row = el("div", line.dir ? "ln dir" : "ln");
    if (line.spec) row.dataset.i = String(fileIdx++);
    let text = "";
    for (const [cls, t] of line.tokens) {
      text += t;
      row.appendChild(cls ? el("span", cls, t) : document.createTextNode(t));
    }
    plain.push(text);
    block.appendChild(row);
  }
  treeEl.replaceChildren(frag);
  treeEl.dataset.chars = String(Math.max(...plain.map((t) => t.length)));
  treeEl.dataset.lines = String(plain.length);
  layoutColumns();
  return plain.join("\n") + "\n";
}

// ---------- Column layout ----------
// When the list is taller than the pane, spread it over every column that
// fits the pane width. Lists that fit the visible height stay in one column.

const COL_GAP = 32;
let charWidth = 0;

function measureCharWidth() {
  const probe = el("span", "", "0".repeat(100));
  probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre";
  treeEl.appendChild(probe);
  const w = probe.getBoundingClientRect().width / 100;
  probe.remove();
  return w;
}

function layoutColumns() {
  if (treeEl.hidden || !treeEl.dataset.lines) return;
  if (!charWidth) charWidth = measureCharWidth();
  const body = treeEl.parentElement;
  const cs = getComputedStyle(treeEl);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const lineH = parseFloat(cs.lineHeight);
  const colW = Number(treeEl.dataset.chars) * charWidth;
  const lines = Number(treeEl.dataset.lines);

  const fitCols = Math.max(1, Math.floor((body.clientWidth - padX + COL_GAP) / (colW + COL_GAP)));
  const visibleRows = Math.max(1, Math.floor((body.clientHeight - padY) / lineH));
  // Fits in one column: keep one. Otherwise use every column the width allows.
  const cols = lines <= visibleRows ? 1 : fitCols;

  treeEl.style.columnCount = cols > 1 ? String(cols) : "";
  treeEl.classList.toggle("multi", cols > 1);
}

new ResizeObserver(() => layoutColumns()).observe(treeEl.parentElement);

function renderMeta(setCount, totalFiles, totalBytes) {
  const items = [
    [String(setCount), setCount === 1 ? " set" : " sets"],
    [fmtNum(totalFiles), totalFiles === 1 ? " file" : " files"],
    [fmtBytes(totalBytes), ""],
  ];
  const frag = document.createDocumentFragment();
  for (const [num, unit] of items) {
    const s = el("span");
    s.appendChild(el("b", "", num));
    if (unit) s.appendChild(document.createTextNode(unit));
    frag.appendChild(s);
  }
  if (totalBytes > WARN_TOTAL_BYTES) frag.appendChild(el("span", "flag", "> 500 MB"));
  metaEl.replaceChildren(frag);
}

function render({ clearStatus = true } = {}) {
  const state = readState();

  // Mode-dependent controls
  const isRange = state.mode === "range";
  rangeFields.hidden = !isRange;
  listFields.hidden = state.mode !== "list";
  boundaryFields.hidden = state.mode !== "boundary";
  unitSeg.hidden = !isRange;
  for (const u of form.querySelectorAll(".range-unit")) u.textContent = state.unit;

  const { sizes, errs } = computeSizes(state);
  showFieldErrors(errs);
  const sizesValid = !Object.values(errs).some(Boolean);

  // Size preview line
  if (sizesValid && sizes.length) {
    const shown = sizes.slice(0, 12).map((s) => s.display).join(", ");
    const suffix = sizes.length > 12 ? `, … (${sizes.length} total)` : "";
    previewEl.textContent = `Sizes: ${shown}${suffix}`;
  } else {
    previewEl.textContent = "";
  }

  // Manifest
  const specs = buildFileSpecs(state, sizes);
  const layout = planOutput(specs);
  zipNameEl.textContent = specs.length ? layout.outName : `DW_${todayISO()}.zip`;
  const totalFiles = specs.length;
  const totalBytes = specs.reduce((a, s) => a + s.sizeBytes, 0);
  const setCount = new Set(specs.map((s) => s.typeKey)).size;

  if (totalFiles === 0) {
    treeEl.replaceChildren();
    treeEl.hidden = true;
    emptyEl.hidden = false;
    emptyMsgEl.textContent =
      errs.sizes ? "Sizes below the format minimum."
      : !sizesValid ? { range: "Invalid size range.", list: "Invalid size list.", boundary: "Invalid boundary limits." }[state.mode]
      : "No file types selected.";
    manifestText = "";
    metaEl.replaceChildren();
  } else {
    treeEl.hidden = false;
    emptyEl.hidden = true;
    manifestText = renderTree(buildTree(specs, state.types, layout));
    renderMeta(setCount, totalFiles, totalBytes);
  }

  // Warning
  if (totalBytes > WARN_TOTAL_BYTES) {
    warningEl.textContent = `Batch is ${fmtBytes(totalBytes)}. Above 500 MB, browser memory can become the bottleneck and the download may fail on Firefox or Safari. Chrome and Edge stream to disk and handle larger sizes.`;
    warningEl.hidden = false;
  } else {
    warningEl.hidden = true;
  }

  generateBtn.disabled = busy || totalFiles === 0;
  copyBtn.disabled = totalFiles === 0;

  // Clear stale status
  if (clearStatus && !busy) setStatus("");

  return specs;
}

function setStatus(msg, cls = "") {
  statusEl.textContent = msg;
  statusEl.classList.remove("ok", "err", "busy");
  if (cls) statusEl.classList.add(cls);
}

// ---------- Zip generation ----------

async function* fileStream(specs, layout, onProgress) {
  let idx = 0;
  for (const spec of specs) {
    idx += 1;
    onProgress(idx, specs.length, spec);
    // Yield to event loop so status updates paint before CPU work
    await new Promise((r) => setTimeout(r, 0));
    const bytes = await makeExact(spec);
    yield {
      name: layout.path(spec),
      input: bytes,
      lastModified: new Date(),
    };
  }
}

async function makeExact(spec) {
  const bytes = await TYPES[spec.typeKey].make(spec.sizeBytes);
  if (bytes.length !== spec.sizeBytes) {
    throw new Error(`${spec.name} came out at ${bytes.length} bytes, expected ${spec.sizeBytes}`);
  }
  return bytes;
}

function markProgress(i) {
  // i is 1-based index of the file now being generated
  const prev = treeEl.querySelector(".ln.cur");
  if (prev) {
    prev.classList.remove("cur");
    prev.classList.add("done");
  }
  const cur = treeEl.querySelector(`.ln[data-i="${i - 1}"]`);
  if (cur) {
    cur.classList.add("cur");
    cur.scrollIntoView({ block: "nearest" });
  }
}

function finishProgress() {
  const prev = treeEl.querySelector(".ln.cur");
  if (prev) {
    prev.classList.remove("cur");
    prev.classList.add("done");
  }
}

async function generate(event) {
  event.preventDefault();
  if (busy) return;

  busy = true;
  const specs = render({ clearStatus: false }); // fresh tree, no stale progress marks
  if (specs.length === 0) {
    busy = false;
    render({ clearStatus: false });
    return;
  }

  const layout = planOutput(specs);
  const outName = layout.outName;
  const single = layout.kind === "single";
  const outMime = single ? specs[0].mime : "application/zip";
  const outExt = "." + outName.split(".").pop();

  form.inert = true;
  generateBtn.disabled = true;
  generateBtn.classList.add("working");
  generateLabel.textContent = "Generating…";
  setStatus("Preparing…", "busy");

  const onProgress = (i, total, spec) => {
    setStatus(`[${i}/${total}] ${layout.path(spec)}`, "busy");
    markProgress(i);
  };

  let cancelled = false;
  try {
    // Prefer streaming direct-to-disk via File System Access API.
    const canSaveFile = "showSaveFilePicker" in window;

    if (canSaveFile) {
      let handle;
      try {
        handle = await window.showSaveFilePicker({
          suggestedName: outName,
          types: [{ description: single ? specs[0].name : "Zip archive", accept: { [outMime]: [outExt] } }],
        });
      } catch (e) {
        if (e && e.name === "AbortError") {
          cancelled = true;
          setStatus("Cancelled.");
          return;
        }
        throw e;
      }
      const writable = await handle.createWritable();
      if (single) {
        onProgress(1, 1, specs[0]);
        await new Promise((r) => setTimeout(r, 0));
        await new Blob([await makeExact(specs[0])]).stream().pipeTo(writable);
      } else {
        const response = downloadZip(fileStream(specs, layout, onProgress));
        await response.body.pipeTo(writable);
      }
      finishProgress();
      setStatus(`Wrote ${outName}.`, "ok");
    } else {
      // Fallback: buffer to a Blob, trigger anchor download.
      let blob;
      if (single) {
        onProgress(1, 1, specs[0]);
        await new Promise((r) => setTimeout(r, 0));
        blob = new Blob([await makeExact(specs[0])], { type: outMime });
      } else {
        blob = await downloadZip(fileStream(specs, layout, onProgress)).blob();
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = outName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      finishProgress();
      setStatus(`Downloaded ${outName} (${fmtBytes(blob.size)}).`, "ok");
    }
  } catch (err) {
    console.error(err);
    setStatus(`Failed: ${err.message || err}`, "err");
  } finally {
    busy = false;
    form.inert = false;
    generateBtn.classList.remove("working");
    generateLabel.textContent = "Generate";
    // Refresh button state; keep the result message (and progress marks) visible.
    if (cancelled) render({ clearStatus: false });
    else generateBtn.disabled = false;
  }
}

// ---------- Copy ----------

async function copyManifest() {
  if (!manifestText) return;
  let ok = false;
  try {
    await navigator.clipboard.writeText(manifestText);
    ok = true;
  } catch {
    // Clipboard API blocked (file://, insecure context): fall back to execCommand
    const ta = document.createElement("textarea");
    ta.value = manifestText;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    ta.remove();
  }
  copyLabel.textContent = ok ? "Copied" : "Copy failed";
  copyBtn.setAttribute("aria-label", ok ? "Copied" : "Copy failed");
  clearTimeout(copyManifest.t);
  copyManifest.t = setTimeout(() => {
    copyLabel.textContent = "Copy";
    copyBtn.setAttribute("aria-label", "Copy manifest");
  }, 1500);
}

// ---------- Numeric inputs and steppers ----------

function sanitize(input) {
  const digits = input.value.replace(/\D+/g, "");
  if (digits !== input.value) {
    const pos = input.selectionStart - (input.value.length - digits.length);
    input.value = digits;
    try { input.setSelectionRange(Math.max(pos, 0), Math.max(pos, 0)); } catch {}
  }
}

function bump(input, delta) {
  const cur = numOrNull(input.value) ?? 0;
  input.value = String(Math.max(1, cur + delta));
  render();
}

for (const input of [startEl, stepEl, maxEl, offsetEl]) {
  input.addEventListener("input", () => sanitize(input));
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") { e.preventDefault(); bump(input, 1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); bump(input, -1); }
  });
}

form.addEventListener("click", (e) => {
  const btn = e.target.closest(".step-btn");
  if (!btn) return;
  bump(document.getElementById(btn.dataset.target), Number(btn.dataset.delta));
});

// ---------- Wire up ----------

form.addEventListener("input", () => render());
form.addEventListener("change", () => render());
form.addEventListener("submit", generate);
copyBtn.addEventListener("click", copyManifest);

render();

})();
</script>
</body>
</html>
